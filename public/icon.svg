<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- Subtle glow overlay -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#glow)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- 3D Box - back face -->
  <path d="M 256 140 L 360 195 L 360 305 L 256 360 L 152 305 L 152 195 Z" 
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- 3D Box - left face -->
  <path d="M 152 195 L 256 250 L 256 360 L 152 305 Z" 
        fill="rgba(255,255,255,0.08)"/>

  <!-- 3D Box - right face -->
  <path d="M 360 195 L 256 250 L 256 360 L 360 305 Z" 
        fill="rgba(255,255,255,0.15)"/>

  <!-- 3D Box - top face -->
  <path d="M 256 140 L 360 195 L 256 250 L 152 195 Z" 
        fill="url(#boxFace)"/>

  <!-- Box edges -->
  <path d="M 256 140 L 360 195 L 256 250 L 152 195 Z" 
        fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 256 250 L 256 360" 
        stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
  <path d="M 152 195 L 152 305 L 256 360 L 360 305 L 360 195" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Code brackets emerging from box -->
  <g filter="url(#innerGlow)">
    <!-- Left bracket < -->
    <path d="M 200 220 L 178 240 L 200 260" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Right bracket > -->
    <path d="M 312 220 L 334 240 L 312 260" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Slash / -->
    <path d="M 270 218 L 242 262" 
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Floating particles / stars -->
  <circle cx="140" cy="130" r="3" fill="white" opacity="0.6"/>
  <circle cx="380" cy="150" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="120" cy="350" r="2" fill="white" opacity="0.4"/>
  <circle cx="400" cy="370" r="3" fill="white" opacity="0.5"/>
  <circle cx="330" cy="110" r="2" fill="white" opacity="0.3"/>
  <circle cx="170" cy="400" r="2.5" fill="white" opacity="0.4"/>

  <!-- Corner accent dots -->
  <circle cx="100" cy="100" r="4" fill="#c084fc" opacity="0.7"/>
  <circle cx="412" cy="412" r="4" fill="#818cf8" opacity="0.7"/>
</svg>
